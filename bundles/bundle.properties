sector.mo-01n-01-abandonedBase.name = Abandoned Base
sector.mo-01n-01-abandonedBase.description =  Hello, this is the planet Cilistis. A virus has been discovered on this planet that has destroyed almost all the fauna, so take over the planet and destroy the virus at any cost.

sector.mo-01n-02-sharpCrystals.name = Sharp Crystals
sector.mo-01n-02-sharpCrystals.description =  You will find crystals here. Crystals are both alive and non-living. The nature of their life is unclear.

sector.mo-01n-03-deadlyIsland.name = Deadly Island
sector.mo-01n-03-deadlyIsland.description =  This island in the middle of a slag lake contains nothing useful. But it used to be a research base.

sector.mo-01n-04-deathPassage.name = Death Passage
sector.mo-01n-04-deathPassage.description =  Find iron and coal and get steel, research new technologies, and be careful, they will attack from two points.

sector.mo-01n-05-hotShore.name = Hot Shore
sector.mo-01n-05-hotShore.description =  This sector does not carry much significance, BUT we must not forget that they are spread across half the planet.

sector.mo-01n-06-plainOfFlesh.name = Plain Of Flesh
sector.mo-01n-06-plainOfFlesh.description = Hello! A large army has been detected here, as well as 3 armored enemies. They have a long range and also damage. Don't let them get close. This entire area was previously suitable for life, but now the infection won

sector.mo-01n-07-fleshStudyBase.name = Flesh Study Base
sector.mo-01n-07-fleshStudyBase.description = This abandoned base where experiments with flesh were carried out

sector.mo-01n-08-dispatchBase.name = Dispatch Base
sector.mo-01n-08-dispatchBase.description = an enemy base that studies the planet just like us

sector.mo-01n-09-erekirPortal.name = Erekir Portal
sector.mo-01n-09-erekirPortal.description = Here we learn about a new planet and also that the spread of the virus that came from Erekira began here. There is something present here.