sector.mo-01n-01-abandonedBase.name = Заброшенная база
sector.mo-01n-01-abandonedBase.description = Здраствуйте, это планета цилистис на этой планете был обнаружен вирус который уничтожил почти всю фауну так что захватите планету и уничтожьте вирус любой ценой

sector.mo-01n-02-sharpCrystals.name = Острые кристаллы
sector.mo-01n-02-sharpCrystals.description =  Здесь обнаруженна в большом количестве кристаллы. Они одновременно живые и неживые. Мы незнаем их природу и их происхождение.

sector.mo-01n-03-deadlyIsland.name = Мертвый остров
sector.mo-01n-03-deadlyIsland.description =  Этот остров не соддержит что-то дорогое но здесь раньше была иследовательская база.

sector.mo-01n-04-deathPassage.name = Смертельный проход
sector.mo-01n-04-deathPassage.description =  найдите железо и уголь тем самым изучите технологии но будьте аккуртанее тут нападют с двух точек

sector.mo-01n-05-hotShore.name = Горячий берег
sector.mo-01n-05-hotShore.description =  Этот сектор не несет практически большой роли НО мы лишаем их теплого места для размножения

sector.mo-01n-06-plainOfFlesh.name = Равнина плоти
sector.mo-01n-06-plainOfFlesh.description = Привет! здесь было обнаружено большое количество врагов в том числе трое бронированных минибосса они имеют большой дальний урон будьте аккуратны а также раньше эта большая часть зоны была нашей базой (map create: Tekta_Ru)

sector.mo-01n-07-fleshStudyBase.name = База изучения плоти
sector.mo-01n-07-fleshStudyBase.description = Эта заброшенная база была раньше лабораторией для изучения плоть

sector.mo-01n-08-dispatchBase.name = База отправки ресурсов
sector.mo-01n-08-dispatchBase.description = они не ожидают тебя увидеть такчто у тебя есть время на развитие, уничтожь их и забери технологии

sector.mo-01n-09-erekirPortal.name = Эрекировский портал
sector.mo-01n-09-erekirPortal.description = Здесь мы узнаем о новой планете, а также о том, что распространение вируса пришедшего с Эрекира началось именно здесь. Здесь что-то присутствует.